name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - if: matrix.node-version == 22
        run: pnpm run smoke:package
      - if: matrix.node-version == 22
        run: pnpm audit --prod --audit-level high

  container:
    name: Container build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --tag whoop-personal-mcp:ci .
      - name: Start image with synthetic configuration
        run: >-
          docker run --detach --name whoop-personal-mcp-ci
          -e WHOOP_CLIENT_ID=container-smoke-client
          -e WHOOP_CLIENT_SECRET=container-smoke-secret
          -e WHOOP_REDIRECT_URI=http://localhost:3000/auth/whoop/callback
          -e ENCRYPTION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef
          -e ACCESS_PASSWORD=container-smoke-password
          whoop-personal-mcp:ci
      - name: Wait for the image health check
        run: |
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' whoop-personal-mcp-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs whoop-personal-mcp-ci
              exit 1
            fi
            sleep 1
          done
          docker logs whoop-personal-mcp-ci
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm --force whoop-personal-mcp-ci || true

  quality-gate:
    name: quality-gate
    if: always()
    needs: [pr-policy, dependency-review, check, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_POLICY_RESULT: ${{ needs.pr-policy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$CHECK_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$PR_POLICY_RESULT" = "success"
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          fi
